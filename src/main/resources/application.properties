spring.application.name=majung-server
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/majung;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
majung.invite-ttl=PT15M
majung.pickup-ttl=PT2H
majung.vehicle-freshness=PT30S
majung.vehicle-last-known=PT2M
server.forward-headers-strategy=none
server.max-http-request-header-size=8KB
majung.deployment=false
majung.admin-key=${MAJUNG_ADMIN_KEY:}
majung.development-tools=true
majung.rate-limit.enabled=true
majung.rate-limit.requests-per-minute=240
majung.rate-limit.writes-per-minute=90
majung.rate-limit.max-clients=10000
majung.retention.enabled=false
majung.retention.period=PT24H
majung.retention.cleanup-interval-ms=300000

# Account login is explicitly enabled only after the Kakao app is configured.
majung.login.enabled=${MAJUNG_LOGIN_ENABLED:false}
majung.login.kakao-client-id=${KAKAO_CLIENT_ID:}
majung.login.kakao-client-secret=${KAKAO_CLIENT_SECRET:}
majung.login.redirect-uri=${KAKAO_REDIRECT_URI:}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# Web push for the arrival notice. Leave all empty to disable it; generate keys with deploy/VapidKeys.java.
majung.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
majung.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
majung.push.subject=${VAPID_SUBJECT:}
majung.push.arrival-seconds=180
# JavaScript key for the passenger map. Leave empty to show text only.
majung.kakao-map.javascript-key=${KAKAO_MAP_JAVASCRIPT_KEY:}
majung.login.kakao-admin-key=${KAKAO_ADMIN_KEY:}
majung.login.kakao-app-id=${KAKAO_APP_ID:}
